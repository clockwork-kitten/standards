name: ci

# The standards repo dogfoods its own conformance tooling on every PR: if the
# tools can't keep this repo conformant, they aren't ready to ship. One
# `conform check` orchestrates canon for docs (markdown lint, references, and
# llms.txt ownership) plus the code track (ESLint + Prettier + knip + the
# TypeScript typecheck), and the repo-hygiene/reusable-markdown workflows round
# out the checks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Checkout canon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/canon
          ref: v0.1
          path: .canon
      - name: Install canon (runtime deps only)
        working-directory: .canon
        run: bun install --frozen-lockfile --production
      - name: Link canon for conform orchestration
        run: |
          set -euo pipefail
          mkdir -p node_modules/@clockwork-kitten
          ln -sfn "$PWD/.canon" node_modules/@clockwork-kitten/canon
      - name: Test the engine
        run: bun run test
      - name: Conform check — markdown, references, and the code track (dogfood)
        run: bun run check:md
      - name: Verify llms.txt is up to date (dogfood)
        run: bun run check:llms

  hygiene:
    uses: ./.github/workflows/repo-hygiene.yml
    with:
      required-files: 'README.md ROADMAP.md IDEAS.md LICENSE llms.txt'

  # Exercise the reusable markdown workflow end-to-end against this repo. It
  # checks out canon at its default ref and auto-discovers canon.config.ts, so
  # references resolve with the same cross-repo ignores as local dogfood.
  reusable-markdown:
    uses: ./.github/workflows/markdown-conformance.yml
