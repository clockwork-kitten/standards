name: ci

# The standards repo dogfoods its own conformance tooling on every PR: if the
# tools can't keep this repo conformant, they aren't ready to ship. Markdown lint
# and the internal cross-reference check both run through the conform engine
# (packages/conform) in one `conform check`; the repo-hygiene reusable workflow
# and the end-to-end reusable-markdown job round out the checks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck the engine
        run: bun run typecheck
      - name: Test the engine
        run: bun run test
      - name: Lint markdown + check references via the engine (dogfood)
        run: bun run check:md
      - name: Verify llms.txt is up to date (dogfood)
        run: bun run check:llms

  hygiene:
    uses: ./.github/workflows/repo-hygiene.yml
    with:
      required-files: 'README.md ROADMAP.md IDEAS.md LICENSE .markdownlint.jsonc llms.txt'

  # Exercise the published reusable workflow end-to-end against this repo (self
  # mode: standards-ref empty uses the caller checkout). It auto-discovers the
  # root conform.config.ts, so references resolve with the same cross-repo ignores
  # as the local dogfood above.
  reusable-markdown:
    uses: ./.github/workflows/markdown-conformance.yml
    with:
      standards-ref: ''
