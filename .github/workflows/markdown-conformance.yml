name: markdown-conformance

# Reusable Markdown-conformance track for clockwork-kitten repos.
# Consume it from a repo's own CI:
#
#   jobs:
#     markdown:
#       uses: clockwork-kitten/standards/.github/workflows/markdown-conformance.yml@v0.2.0
#
# It runs the conform engine (packages/conform, @clockwork-kitten/conform) against
# the studio baseline and the internal cross-reference checker. The engine isn't
# published to a registry, so this workflow checks out clockwork-kitten/standards
# at `standards-ref`, installs the engine's runtime deps with Bun, and runs its
# `conform check` CLI against the calling repo. Sensible defaults; override via inputs.

on:
  workflow_call:
    inputs:
      paths:
        description: 'Globs the engine lints (space-separated). node_modules/.git/.standards are always ignored.'
        type: string
        default: '**/*.md'
      config:
        description: 'Path to a conform.config.* in the calling repo. Empty auto-discovers one, else the bundled studio baseline.'
        type: string
        default: ''
      reference-check:
        description: 'Run the internal cross-reference checker.'
        type: boolean
        default: true
      reference-roots:
        description: 'Directories the reference checker scans (space-separated).'
        type: string
        default: '.'
      reference-ignore:
        description: 'Substrings marking a backtick path as external/cross-repo, not resolved (space-separated).'
        type: string
        default: ''
      standards-ref:
        description: 'Ref of clockwork-kitten/standards providing the engine + scripts. Empty uses the caller checkout (self/dogfood).'
        type: string
        default: 'v0.2.0'

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout standards engine
        if: inputs.standards-ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Resolve engine root
        id: engine
        env:
          STANDARDS_REF: ${{ inputs.standards-ref }}
        run: |
          set -euo pipefail
          if [ -n "$STANDARDS_REF" ]; then
            echo "root=.standards" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi
      - name: Install engine (runtime deps only)
        working-directory: ${{ steps.engine.outputs.root }}
        run: bun install --frozen-lockfile --production
      - name: Link engine for config self-imports
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
        run: |
          set -euo pipefail
          # A repo `conform.config.ts` imports `@clockwork-kitten/conform`; make that
          # specifier resolvable from the caller root, whether the engine lives here
          # (self mode) or under `.standards`. jsonc/plain configs don't need this.
          mkdir -p node_modules/@clockwork-kitten
          ln -sfn "$PWD/$ENGINE_ROOT/packages/conform" node_modules/@clockwork-kitten/conform
      - name: Lint Markdown via the conform engine
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
          CONFIG: ${{ inputs.config }}
          PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          args=(check $PATHS)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          bun "$ENGINE_ROOT/packages/conform/src/cli/main.ts" "${args[@]}"

  references:
    if: inputs.reference-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout standards baseline
        if: inputs.standards-ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'
      - name: Resolve checker path
        id: script
        env:
          STANDARDS_REF: ${{ inputs.standards-ref }}
        run: |
          set -euo pipefail
          if [ -n "$STANDARDS_REF" ]; then
            echo "path=.standards/scripts/check_references.py" >> "$GITHUB_OUTPUT"
          else
            echo "path=scripts/check_references.py" >> "$GITHUB_OUTPUT"
          fi
      - name: Check internal cross-references
        env:
          CHECKER: ${{ steps.script.outputs.path }}
          ROOTS: ${{ inputs.reference-roots }}
          IGNORE: ${{ inputs.reference-ignore }}
        run: |
          set -euo pipefail
          args=(--repo-root . --skip-dir .standards)
          for sub in $IGNORE; do
            args+=(--ignore-substr "$sub")
          done
          python3 "$CHECKER" "${args[@]}" $ROOTS
