name: markdown-conformance

# Reusable Markdown-conformance track for clockwork-kitten repos.
# Consume it from a repo's own CI:
#
#   jobs:
#     markdown:
#       uses: clockwork-kitten/standards/.github/workflows/markdown-conformance.yml@v0.3.0
#
# It runs the conform engine (packages/conform, @clockwork-kitten/conform) against
# the studio baseline: markdown lint plus the internal cross-reference checker, in
# one `conform check` invocation, and can optionally verify a generated `llms.txt`
# doc index (`llms-check`). The engine isn't published to a registry, so this
# workflow checks out the engine and runs its CLI against the calling repo.
#
# Engine/workflow lockstep: by default the engine is pinned to the EXACT
# clockwork-kitten/standards commit this workflow was called at
# (github.job_workflow_sha). So `uses: ...@v0.3.0` runs the v0.3.0 engine, and
# `@v0.3` (the moving alias) always runs the matching engine — the two can never
# diverge, and consumers never set a ref. Sensible defaults; override via inputs.

on:
  workflow_call:
    inputs:
      paths:
        description: 'Globs the engine checks (space-separated). node_modules/.git/.standards are always ignored.'
        type: string
        default: '**/*.md'
      config:
        description: 'Path to a conform.config.* in the calling repo. Empty auto-discovers one, else the bundled studio baseline.'
        type: string
        default: ''
      reference-check:
        description: 'Run the internal cross-reference checker as part of the engine check.'
        type: boolean
        default: true
      reference-ignore:
        description: 'Substrings marking a backtick path as external/cross-repo, not resolved (space-separated). Layered on top of the config''s references.ignore.'
        type: string
        default: ''
      llms-check:
        description: 'Verify the committed llms.txt is up to date. Requires an `llms` block in the calling repo''s conform config.'
        type: boolean
        default: false
      self:
        description: 'Dogfood mode: the engine is the calling checkout itself (skip the engine checkout). Only clockwork-kitten/standards sets this.'
        type: boolean
        default: false
      standards-ref:
        description: 'Advanced override: pin the engine to a specific clockwork-kitten/standards ref instead of the commit this workflow was called at. Empty (default) auto-locks the engine to github.job_workflow_sha.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout standards engine
        if: ${{ !inputs.self }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/standards
          # Empty standards-ref → lock to the exact commit this reusable workflow
          # was resolved to, so the engine always matches the pinned workflow.
          ref: ${{ inputs.standards-ref != '' && inputs.standards-ref || github.job_workflow_sha }}
          path: .standards
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Resolve engine root
        id: engine
        env:
          SELF: ${{ inputs.self }}
        run: |
          set -euo pipefail
          if [ "$SELF" = "true" ]; then
            echo "root=." >> "$GITHUB_OUTPUT"
          else
            echo "root=.standards" >> "$GITHUB_OUTPUT"
          fi
      - name: Install engine (runtime deps only)
        working-directory: ${{ steps.engine.outputs.root }}
        run: bun install --frozen-lockfile --production
      - name: Link engine for config self-imports
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
        run: |
          set -euo pipefail
          # A repo `conform.config.ts` imports `@clockwork-kitten/conform`; make that
          # specifier resolvable from the caller root, whether the engine lives here
          # (self mode) or under `.standards`. jsonc/plain configs don't need this.
          mkdir -p node_modules/@clockwork-kitten
          ln -sfn "$PWD/$ENGINE_ROOT/packages/conform" node_modules/@clockwork-kitten/conform
      - name: Run the conform engine (markdown lint + references)
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
          CONFIG: ${{ inputs.config }}
          PATHS: ${{ inputs.paths }}
          REFERENCE_CHECK: ${{ inputs.reference-check }}
          REFERENCE_IGNORE: ${{ inputs.reference-ignore }}
        run: |
          set -euo pipefail
          args=(check $PATHS)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          if [ "$REFERENCE_CHECK" != "true" ]; then
            args+=(--no-references)
          fi
          for sub in $REFERENCE_IGNORE; do
            args+=(--reference-ignore "$sub")
          done
          bun "$ENGINE_ROOT/packages/conform/src/cli/main.ts" "${args[@]}"
      - name: Verify llms.txt is up to date
        if: inputs.llms-check
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          args=(llms --check)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          bun "$ENGINE_ROOT/packages/conform/src/cli/main.ts" "${args[@]}"
