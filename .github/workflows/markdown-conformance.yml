name: markdown-conformance

# Reusable Markdown-conformance track for clockwork-kitten repos.
# Consume it from a repo's own CI:
#
#   jobs:
#     markdown:
#       uses: clockwork-kitten/standards/.github/workflows/markdown-conformance.yml@v0.2.0
#
# It runs the conform engine (packages/conform, @clockwork-kitten/conform) against
# the studio baseline: markdown lint plus the internal cross-reference checker, in
# one `conform check` invocation. The engine isn't published to a registry, so this
# workflow checks out clockwork-kitten/standards at `standards-ref`, installs the
# engine's runtime deps with Bun, and runs its CLI against the calling repo.
# Sensible defaults; override via inputs.

on:
  workflow_call:
    inputs:
      paths:
        description: 'Globs the engine checks (space-separated). node_modules/.git/.standards are always ignored.'
        type: string
        default: '**/*.md'
      config:
        description: 'Path to a conform.config.* in the calling repo. Empty auto-discovers one, else the bundled studio baseline.'
        type: string
        default: ''
      reference-check:
        description: 'Run the internal cross-reference checker as part of the engine check.'
        type: boolean
        default: true
      reference-ignore:
        description: 'Substrings marking a backtick path as external/cross-repo, not resolved (space-separated). Layered on top of the config''s references.ignore.'
        type: string
        default: ''
      standards-ref:
        description: 'Ref of clockwork-kitten/standards providing the engine. Empty uses the caller checkout (self/dogfood).'
        type: string
        default: 'v0.2.0'

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout standards engine
        if: inputs.standards-ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Resolve engine root
        id: engine
        env:
          STANDARDS_REF: ${{ inputs.standards-ref }}
        run: |
          set -euo pipefail
          if [ -n "$STANDARDS_REF" ]; then
            echo "root=.standards" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi
      - name: Install engine (runtime deps only)
        working-directory: ${{ steps.engine.outputs.root }}
        run: bun install --frozen-lockfile --production
      - name: Link engine for config self-imports
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
        run: |
          set -euo pipefail
          # A repo `conform.config.ts` imports `@clockwork-kitten/conform`; make that
          # specifier resolvable from the caller root, whether the engine lives here
          # (self mode) or under `.standards`. jsonc/plain configs don't need this.
          mkdir -p node_modules/@clockwork-kitten
          ln -sfn "$PWD/$ENGINE_ROOT/packages/conform" node_modules/@clockwork-kitten/conform
      - name: Run the conform engine (markdown lint + references)
        env:
          ENGINE_ROOT: ${{ steps.engine.outputs.root }}
          CONFIG: ${{ inputs.config }}
          PATHS: ${{ inputs.paths }}
          REFERENCE_CHECK: ${{ inputs.reference-check }}
          REFERENCE_IGNORE: ${{ inputs.reference-ignore }}
        run: |
          set -euo pipefail
          args=(check $PATHS)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          if [ "$REFERENCE_CHECK" != "true" ]; then
            args+=(--no-references)
          fi
          for sub in $REFERENCE_IGNORE; do
            args+=(--reference-ignore "$sub")
          done
          bun "$ENGINE_ROOT/packages/conform/src/cli/main.ts" "${args[@]}"
