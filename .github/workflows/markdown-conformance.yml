name: markdown-conformance

# Reusable Markdown-conformance track for clockwork-kitten repos.
# Consume it from a repo's own CI:
#
#   jobs:
#     markdown:
#       uses: clockwork-kitten/standards/.github/workflows/markdown-conformance.yml@v0.1.0
#
# It runs markdownlint (via markdownlint-cli2) against the studio baseline config
# and the internal cross-reference checker. Sensible defaults; override via inputs.

on:
  workflow_call:
    inputs:
      paths:
        description: 'Globs passed to markdownlint-cli2 (space-separated, quoted).'
        type: string
        default: '"**/*.md" "#node_modules"'
      config:
        description: 'markdownlint config path in the calling repo. Empty uses the studio baseline.'
        type: string
        default: ''
      reference-check:
        description: 'Run the internal cross-reference checker.'
        type: boolean
        default: true
      reference-roots:
        description: 'Directories the reference checker scans (space-separated).'
        type: string
        default: '.'
      reference-ignore:
        description: 'Substrings marking a backtick path as external/cross-repo, not resolved (space-separated).'
        type: string
        default: ''
      standards-ref:
        description: 'Ref of clockwork-kitten/standards for shared config/scripts. Empty uses the caller checkout (self/dogfood).'
        type: string
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout standards baseline
        if: inputs.standards-ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - name: Resolve config path
        id: cfg
        env:
          CONFIG: ${{ inputs.config }}
          STANDARDS_REF: ${{ inputs.standards-ref }}
        run: |
          set -euo pipefail
          if [ -n "$CONFIG" ]; then
            path="$CONFIG"
          elif [ -n "$STANDARDS_REF" ]; then
            path=".standards/.markdownlint.jsonc"
          else
            path=".markdownlint.jsonc"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 --config "${{ steps.cfg.outputs.path }}" ${{ inputs.paths }} "#.standards"

  references:
    if: inputs.reference-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout standards baseline
        if: inputs.standards-ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/standards
          ref: ${{ inputs.standards-ref }}
          path: .standards
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.x'
      - name: Resolve checker path
        id: script
        env:
          STANDARDS_REF: ${{ inputs.standards-ref }}
        run: |
          set -euo pipefail
          if [ -n "$STANDARDS_REF" ]; then
            echo "path=.standards/scripts/check_references.py" >> "$GITHUB_OUTPUT"
          else
            echo "path=scripts/check_references.py" >> "$GITHUB_OUTPUT"
          fi
      - name: Check internal cross-references
        env:
          CHECKER: ${{ steps.script.outputs.path }}
          ROOTS: ${{ inputs.reference-roots }}
          IGNORE: ${{ inputs.reference-ignore }}
        run: |
          set -euo pipefail
          args=(--repo-root . --skip-dir .standards)
          for sub in $IGNORE; do
            args+=(--ignore-substr "$sub")
          done
          python3 "$CHECKER" "${args[@]}" $ROOTS
