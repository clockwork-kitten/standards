name: markdown-conformance

# Reusable Markdown-conformance track for clockwork-kitten repos.
# Consume it from a repo's own CI:
#
#   jobs:
#     markdown:
#       uses: clockwork-kitten/standards/.github/workflows/markdown-conformance.yml@v0.3.0
#
# It runs canon, the standalone documentation-conformance tool, against the
# calling repo: markdown lint plus internal cross-reference checks in one `canon
# check` invocation, and can optionally verify a generated `llms.txt` doc index
# (`llms-check`). Canon isn't consumed from npm here; this workflow checks out
# clockwork-kitten/canon from source, installs its production deps, and runs its
# CLI directly against the calling repo.
#
# Engine/workflow lockstep: canon is now a separate repo, so github.job_workflow_sha
# no longer pins the engine. The workflow pins canon through `canon-ref`, which
# defaults to the moving major alias `v0.1`; consumers can override it when they
# need an exact canon tag or SHA.

on:
  workflow_call:
    inputs:
      paths:
        description: 'Globs canon checks (space-separated). node_modules/.git/.canon are always ignored.'
        type: string
        default: '**/*.md'
      config:
        description: 'Path to a canon.config.* in the calling repo. Empty auto-discovers one.'
        type: string
        default: ''
      reference-check:
        description: 'Run canon reference checks.'
        type: boolean
        default: true
      reference-ignore:
        description: 'Substrings marking a backtick path as external/cross-repo, not resolved (space-separated).'
        type: string
        default: ''
      llms-check:
        description: 'Verify the committed llms.txt is up to date. Requires an `llms` block in canon config.'
        type: boolean
        default: false
      canon-ref:
        description: 'Canon ref to check out from clockwork-kitten/canon.'
        type: string
        default: 'v0.1'

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Checkout canon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: clockwork-kitten/canon
          ref: ${{ inputs.canon-ref }}
          path: .canon
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install canon (runtime deps only)
        working-directory: .canon
        run: bun install --frozen-lockfile --production
      - name: Link canon for config self-imports
        run: |
          set -euo pipefail
          mkdir -p node_modules/@clockwork-kitten
          ln -sfn "$PWD/.canon" node_modules/@clockwork-kitten/canon
      - name: Run canon check (markdown lint + references)
        env:
          CONFIG: ${{ inputs.config }}
          PATHS: ${{ inputs.paths }}
          REFERENCE_CHECK: ${{ inputs.reference-check }}
          REFERENCE_IGNORE: ${{ inputs.reference-ignore }}
        run: |
          set -euo pipefail
          args=(check $PATHS)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          if [ "$REFERENCE_CHECK" != "true" ]; then
            args+=(--no-references)
          fi
          for sub in $REFERENCE_IGNORE; do
            args+=(--reference-ignore "$sub")
          done
          bun .canon/src/cli/main.ts "${args[@]}"
      - name: Verify llms.txt is up to date
        if: inputs.llms-check
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          args=(llms --check)
          if [ -n "$CONFIG" ]; then
            args+=(--config "$CONFIG")
          fi
          bun .canon/src/cli/main.ts "${args[@]}"
