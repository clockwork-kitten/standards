name: publish-crux

on:
  pull_request:
    paths:
      - .github/workflows/publish-crux.yml
      - bun.lock
      - package.json
      - packages/crux/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-crux.yml
      - bun.lock
      - package.json
      - packages/crux/**
  workflow_dispatch:
    inputs:
      version:
        description: "Unpublished 0.x prerelease version, for example 0.1.0-alpha.1."
        required: true
        type: string

permissions:
  contents: read

jobs:
  distribution:
    name: distribution / node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Verify packed distribution
        run: node packages/crux/test/distribution/verify-package.mjs

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: distribution
    runs-on: ubuntu-latest
    environment: crux-npm
    concurrency:
      group: crux-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Validate immutable prerelease version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^0\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$'; then
            echo "::error::version must be a 0.x prerelease such as 0.1.0-alpha.1"
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@clockwork-kitten%2fcrux/$VERSION")
          case "$status" in
            404) ;;
            200)
              echo "::error::@clockwork-kitten/crux@$VERSION already exists and cannot be replaced"
              exit 1
              ;;
            *)
              echo "::error::registry version check failed with HTTP $status"
              exit 1
              ;;
          esac
      - name: Set candidate version
        working-directory: packages/crux
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Reverify versioned packed distribution
        run: node packages/crux/test/distribution/verify-package.mjs
      - name: Publish public package with OIDC provenance
        working-directory: packages/crux
        run: npx --yes npm@12.2.3 publish --access public --provenance --tag next
      - name: Record public artifact evidence
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="@clockwork-kitten/crux@$VERSION"
          for attempt in 1 2 3 4 5; do
            if evidence=$(npm view "$package" version dist.tarball dist.integrity dist.attestations --json); then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::published package did not become visible"
              exit 1
            fi
            sleep 6
          done
          {
            echo "## Published Crux"
            echo
            echo "- Package: https://www.npmjs.com/package/@clockwork-kitten/crux/v/$VERSION"
            echo "- Dist-tag: \`next\`"
            echo
            echo '```json'
            echo "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
