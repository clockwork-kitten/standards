name: publish-crux

on:
  pull_request:
    paths:
      - .github/workflows/publish-crux.yml
      - bun.lock
      - package.json
      - packages/crux/**
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-crux.yml
      - bun.lock
      - package.json
      - packages/crux/**
  workflow_dispatch:
    inputs:
      version:
        description: "Unpublished 0.x prerelease version, for example 0.1.0-alpha.1."
        required: true
        type: string
      bootstrap:
        description: "One-time token bootstrap; fails after the package exists."
        default: false
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  distribution:
    name: distribution / node-${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
      - name: Verify packed distribution
        run: node packages/crux/test/distribution/verify-package.mjs

  release-check:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: distribution
    runs-on: ubuntu-latest
    steps:
      - name: Validate release mode and immutable prerelease version
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^0\.[0-9]+\.[0-9]+-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$'; then
            echo "::error::version must be a 0.x prerelease such as 0.1.0-alpha.1"
            exit 1
          fi

          package_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@clockwork-kitten%2fcrux")
          if [ "$BOOTSTRAP" = "true" ] && [ "$package_status" != "404" ]; then
            echo "::error::bootstrap is permanently disabled once any package version exists"
            exit 1
          fi
          if [ "$BOOTSTRAP" = "false" ] && [ "$package_status" != "200" ]; then
            echo "::error::trusted publication requires the existing package; use the one-time bootstrap"
            exit 1
          fi

          version_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@clockwork-kitten%2fcrux/$VERSION")
          case "$version_status" in
            404) ;;
            200)
              echo "::error::@clockwork-kitten/crux@$VERSION already exists and cannot be replaced"
              exit 1
              ;;
            *)
              echo "::error::registry version check failed with HTTP $version_status"
              exit 1
              ;;
          esac

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.bootstrap
    needs: release-check
    runs-on: ubuntu-latest
    environment: crux-npm
    concurrency:
      group: crux-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Recheck immutable version after approval
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@clockwork-kitten%2fcrux/$VERSION")
          if [ "$status" != "404" ]; then
            echo "::error::version is no longer unpublished (registry HTTP $status)"
            exit 1
          fi
      - name: Set candidate version
        working-directory: packages/crux
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Reverify versioned packed distribution
        run: node packages/crux/test/distribution/verify-package.mjs
      - name: Publish public package with OIDC provenance
        working-directory: packages/crux
        run: npx --yes npm@12.2.3 publish --access public --provenance --tag next
      - name: Verify public artifact and npm attestation
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/crux/test/distribution/verify-published-package.mjs "$VERSION"

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.bootstrap
    needs: release-check
    runs-on: ubuntu-latest
    environment: crux-npm
    concurrency:
      group: crux-npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Refuse bootstrap after package creation
        run: |
          set -euo pipefail
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@clockwork-kitten%2fcrux")
          if [ "$status" != "404" ]; then
            echo "::error::bootstrap is permanently disabled (registry HTTP $status)"
            exit 1
          fi
      - name: Set candidate version
        working-directory: packages/crux
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Reverify versioned packed distribution
        run: node packages/crux/test/distribution/verify-package.mjs
      - name: Bootstrap public package with short-lived token and provenance
        working-directory: packages/crux
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_BOOTSTRAP_TOKEN is required only for the one-time bootstrap"
            exit 1
          fi
          npx --yes npm@12.2.3 publish --access public --provenance --tag next
      - name: Verify public artifact and npm attestation
        env:
          VERSION: ${{ inputs.version }}
        run: node packages/crux/test/distribution/verify-published-package.mjs "$VERSION"
